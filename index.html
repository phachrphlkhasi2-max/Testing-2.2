<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Birthday Cake 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Mali', cursive, sans-serif;
      background-color: #f7f7f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #4a4a4a;
    }

    .container {
      text-align: center;
      position: relative;
      width: 320px;
    }

    /* พื้นที่เค้ก */
    .cake-area {
      position: relative;
      width: 260px;
      height: 240px;
      margin: 0 auto;
      cursor: pointer;
    }

    /* ตัวเค้ก SVG */
    .cake-base {
      width: 100%;
      height: auto;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    /* เทียนแต่ละเล่ม */
    .candle {
      position: absolute;
      width: 12px;
      height: 45px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .candle.active {
      opacity: 1;
    }

    .candle-body {
      width: 100%;
      height: 35px;
      border-radius: 4px;
      position: absolute;
      bottom: 0;
    }

    .candle:nth-child(1) .candle-body { background: #ff758c; }
    .candle:nth-child(2) .candle-body { background: #ffc107; }
    .candle:nth-child(3) .candle-body { background: #4caf50; }
    .candle:nth-child(4) .candle-body { background: #00bcd4; }

    /* เปลวไฟ */
    .flame {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 14px;
      background: #ff9800;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 8px #ffeb3b;
      animation: flicker 0.6s infinite alternate;
      transition: opacity 0.3s;
    }

    .flame.off {
      opacity: 0;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.1); }
    }

    /* ตำแหน่งปักเทียนบนเค้ก */
    .candle:nth-child(1) { top: 35px; left: 70px; }
    .candle:nth-child(2) { top: 35px; left: 105px; }
    .candle:nth-child(3) { top: 35px; left: 145px; }
    .candle:nth-child(4) { top: 35px; left: 180px; }

    /* ข้อความแนะนำด้านล่าง */
    .instruction {
      margin-top: 30px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #666;
      min-height: 40px;
    }

    /* ซองจดหมาย */
    .envelope-btn {
      display: none;
      margin: 20px auto 0;
      width: 100px;
      height: 70px;
      background: #ff5e7e;
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .envelope-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-top: 38px solid #ff80ab;
    }

    .flower-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -20%);
      font-size: 20px;
      z-index: 2;
    }

    /* Popup หน้าการ์ดจดหมาย */
    .letter-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .letter-card {
      background: #fff8f8;
      width: 90%;
      max-width: 360px;
      padding: 25px;
      border-radius: 16px;
      border: 2px dashed #ff80ab;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      animation: pop 0.4s ease;
    }

    .letter-card h3 {
      color: #ff4081;
      margin-bottom: 12px;
      font-size: 1.3rem;
    }

    .letter-card p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 15px;
      text-align: left;
    }

    .letter-card img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #aaa;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- พื้นที่เค้ก -->
    <div class="cake-area" onclick="handleCakeClick()">
      <!-- เทียน 4 เล่ม -->
      <div class="candle" id="c1"><div class="flame"></div><div class="candle-body"></div></div>
      <div class="candle" id="c2"><div class="flame"></div><div class="candle-body"></div></div>
      <div class="candle" id="c3"><div class="flame"></div><div class="candle-body"></div></div>
      <div class="candle" id="c4"><div class="flame"></div><div class="candle-body"></div></div>

      <!-- รูปเค้ก SVG -->
      <svg class="cake-base" viewBox="0 0 200 160">
        <!-- ชั้นล่าง -->
        <path d="M 20,100 Q 20,90 30,90 L 170,90 Q 180,90 180,100 L 180,150 Q 180,160 170,160 L 30,160 Q 20,160 20,150 Z" fill="#f8bbd0"/>
        <path d="M 20,100 Q 30,115 45,100 Q 60,115 75,100 Q 90,115 105,100 Q 120,115 135,100 Q 150,115 165,100 Q 180,115 180,100 L 180,90 L 20,90 Z" fill="#f48fb1"/>
        <!-- เชอร์รี่ชั้นล่าง -->
        <circle cx="30" cy="90" r="5" fill="#d81b60"/><circle cx="170" cy="90" r="5" fill="#d81b60"/>
        <!-- ชั้นบน -->
        <path d="M 45,45 Q 45,35 55,35 L 145,35 Q 155,35 155,45 L 155,90 L 45,90 Z" fill="#f8bbd0"/>
        <path d="M 45,45 Q 55,60 70,45 Q 85,60 100,45 Q 115,60 130,45 Q 145,60 155,45 L 155,35 L 45,35 Z" fill="#f48fb1"/>
        <!-- เชอร์รี่ชั้นบน -->
        <circle cx="55" cy="35" r="5" fill="#d81b60"/><circle cx="100" cy="35" r="5" fill="#d81b60"/><circle cx="145" cy="35" r="5" fill="#d81b60"/>
      </svg>
    </div>

    <!-- ข้อความคำสั่ง -->
    <div class="instruction" id="instructionText">กดที่เค้กค้าบบไอดื้ออ 🎂</div>

    <!-- ปุ่มซองจดหมาย -->
    <div class="envelope-btn" id="envelopeBtn" onclick="openLetter()">
      <div class="flower-icon">🌸</div>
    </div>
  </div>

  <!-- Modal เปิดจดหมาย -->
  <div class="letter-modal" id="letterModal">
    <div class="letter-card">
      <span class="close-modal" onclick="closeLetter()">✕</span>
      <h3>✨ สุขสันต์วันเกิดน้าา ✨</h3>
      <p>
        สุขสันต์วันเกิดน้าาไอตัวเลกก ขอให้หนูมีความสุขม๊ากกก สุขภาพแข็งแรง <br>
        สมหวังในทุกๆเรื่อง ยิ้มเย้ออๆ หนูมีพี่คอยซับพอตอยู่ตรงนี้เสมอน้าไอเด้กก <br>
        เหนื่อยก้พักบ้างง แล้ววก้อย่าลืมกินข้าวเช้าาด้วยหละ 💖
      </p>
      <!-- รูปภาพที่นำเข้าจาก GitHub -->
      <img src="Photo.jpg" alt="Birthday Photo">
    </div>
  </div>

  <script>
    let step = 0;
    const texts = [
      "กดที่เค้กสิคั้บบ 🎂",
      "ปักอีกก!! 🕯️",
      "ปักอีกหน่อยยยย ✨",
      "ปักอีกกคั้บบ 🔥",
      "เย่ๆ!!! อวยพรร แล้วเป่าเลยคั้บบ 🫶",
      "การ์ดอวยพรจากกพี่ ✉️"
    ];

    function handleCakeClick() {
      if (step < 4) {
        step++;
        document.getElementById(`c${step}`).classList.add('active');
        document.getElementById('instructionText').innerText = texts[step];
      } else if (step === 4) {
        // ขั้นตอนเป่าดับเทียน
        for (let i = 1; i <= 4; i++) {
          document.querySelector(`#c${i} .flame`).classList.add('off');
        }
        step++;
        document.getElementById('instructionText').innerText = texts[step];
        document.getElementById('envelopeBtn').style.display = 'block';
        
        // จุดพลุฉลอง
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function openLetter() {
      document.getElementById('letterModal').style.display = 'flex';
    }

    function closeLetter() {
      document.getElementById('letterModal').style.display = 'none';
    }
  </script>
</body>
</html>
